<svg width="880" height="220" viewBox="0 0 880 220" preserveAspectRatio="xMidYMid meet" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="scan2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#2563eb" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="barShine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d4ed8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#0f172a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#1d4ed8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="railGlow2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#1d4ed8" stop-opacity="1"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </linearGradient>
    <filter id="tsGlow2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="tsClip"><rect x="0.5" y="0.5" width="879" height="219" rx="12"/></clipPath>
    <clipPath id="bar1Clip"><rect x="360" y="90" width="360" height="6" rx="3"/></clipPath>
    <clipPath id="bar2Clip"><rect x="360" y="114" width="360" height="6" rx="3"/></clipPath>
  </defs>

  <rect x="0.5" y="0.5" width="879" height="219" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>

  <g clip-path="url(#tsClip)">
    <rect x="0" y="-40" width="880" height="40" fill="url(#scan2)">
      <animate attributeName="y" values="-40;220" dur="9s" repeatCount="indefinite"/>
    </rect>

    <rect x="1" y="1" width="878" height="34" rx="12" fill="#eef2f7"/>
    <rect x="1" y="20" width="878" height="15" fill="#eef2f7"/>
    <circle cx="22" cy="18" r="5.5" fill="#94a3b8"/>
    <circle cx="42" cy="18" r="5.5" fill="#94a3b8"/>
    <circle cx="62" cy="18" r="5.5" fill="#94a3b8"/>
    <text x="440" y="22" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" fill="#475569">muhammed@bursa: ~/var/log</text>
    <line x1="1" y1="35" x2="879" y2="35" stroke="#cbd5e1" stroke-width="1"/>

    <rect x="1" y="36" width="2" height="183" fill="#2563eb" opacity="0.55"/>
    <rect x="1" y="36" width="2" height="60" fill="url(#railGlow2)" filter="url(#tsGlow2)">
      <animate attributeName="y" values="36;159;36" dur="5s" repeatCount="indefinite"/>
    </rect>

    <line x1="54" y1="36" x2="54" y2="220" stroke="#cbd5e1" stroke-width="1"/>
    <g font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" fill="#64748b" text-anchor="end">
      <text x="42" y="70">01</text>
      <text x="42" y="100">02</text>
      <text x="42" y="124">03</text>
      <text x="42" y="148">04</text>
      <text x="42" y="172">05</text>
    </g>

    <g font-family="'JetBrains Mono', Consolas, monospace" font-size="13.5">
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.1s" fill="freeze"/>
        <text x="70" y="70"><tspan fill="#2563eb">$</tspan><tspan fill="#0f172a"> tail -f /var/log/muhammed-koca.log</tspan></text>
      </g>

      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.5s" fill="freeze"/>
        <text x="70" y="100"><tspan fill="#475569">build   </tspan><tspan fill="#0f172a">   MusclePull Updates</tspan></text>
      </g>
      <rect x="360" y="90" width="360" height="6" rx="3" fill="#cbd5e1"/>
      <rect x="360" y="90" width="0" height="6" rx="3" fill="#2563eb">
        <animate attributeName="width" from="0" to="288" dur="1.2s" begin="0.8s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1" keyTimes="0;1"/>
      </rect>
      <g clip-path="url(#bar1Clip)">
        <rect x="-80" y="90" width="80" height="6" fill="url(#barShine)" opacity="0.75">
          <animate attributeName="x" values="-80;720" dur="3s" begin="2.2s" repeatCount="indefinite"/>
        </rect>
      </g>
      <text x="734" y="100" fill="#475569" opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="2s" fill="freeze"/>80%</text>

      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.7s" fill="freeze"/>
        <text x="70" y="124"><tspan fill="#475569">build   </tspan><tspan fill="#0f172a">   Linux Systems</tspan></text>
      </g>
      <rect x="360" y="114" width="360" height="6" rx="3" fill="#cbd5e1"/>
      <rect x="360" y="114" width="0" height="6" rx="3" fill="#2563eb">
        <animate attributeName="width" from="0" to="324" dur="1.4s" begin="1s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1" keyTimes="0;1"/>
      </rect>
      <g clip-path="url(#bar2Clip)">
        <rect x="-80" y="114" width="80" height="6" fill="url(#barShine)" opacity="0.75">
          <animate attributeName="x" values="-80;720" dur="3.4s" begin="2.6s" repeatCount="indefinite"/>
        </rect>
      </g>
      <text x="734" y="124" fill="#475569" opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="2.4s" fill="freeze"/>90%</text>

      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.9s" fill="freeze"/>
        <text x="70" y="148"><tspan fill="#475569">write   </tspan><tspan fill="#0f172a">   daily AI-assisted content pipeline &#8212; muhammedkoca.com.tr</tspan></text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.1s" fill="freeze"/>
        <text x="70" y="172"><tspan fill="#475569">goal    </tspan><tspan fill="#0f172a">   System Architect</tspan></text>
      </g>
    </g>

    <rect x="76" y="188" width="8" height="14" fill="#2563eb" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.4s" fill="freeze"/>
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" begin="1.7s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>

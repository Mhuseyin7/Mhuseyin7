<svg width="880" height="228" viewBox="0 0 880 228" preserveAspectRatio="xMidYMid meet" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ember" x1="0" y1="0" x2="880" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7f1d1d"/><stop offset="0.5" stop-color="#dc2626"/><stop offset="1" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="880" y2="228" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1a080c"/><stop offset="1" stop-color="#050203"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dc2626" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#dc2626" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#dc2626" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="titleBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#150609"/>
      <stop offset="1" stop-color="#0a0304"/>
    </linearGradient>
    <linearGradient id="barFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7f1d1d"/>
      <stop offset="1" stop-color="#f43f5e"/>
    </linearGradient>
    <clipPath id="clip"><rect x="1.5" y="1.5" width="877" height="225" rx="14"/></clipPath>
  </defs>

  <rect x="1.5" y="1.5" width="877" height="225" rx="14" fill="url(#bg)" stroke="url(#ember)" stroke-width="1.6"/>
  <g clip-path="url(#clip)">
    <rect x="0" y="-46" width="880" height="46" fill="url(#scan)"><animate attributeName="y" from="-46" to="228" dur="5.5s" repeatCount="indefinite"/></rect>

    <!-- title bar -->
    <rect x="1.5" y="1.5" width="877" height="36" fill="url(#titleBar)"/>
    <circle cx="22" cy="19" r="6" fill="#ff5f56"/><circle cx="44" cy="19" r="6" fill="#ffbd2e"/><circle cx="66" cy="19" r="6" fill="#27c93f"/>
    <text x="440" y="23" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#a3a3a3">muhammed@bursa: ~/var/log</text>
    <g transform="translate(830 12)">
      <circle cx="6" cy="7" r="3" fill="#dc2626">
        <animate attributeName="opacity" values="1;0.4;1" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <text x="16" y="11" font-family="Consolas, monospace" font-size="10.5" fill="#dc2626" opacity="0.85" letter-spacing="1">LIVE</text>
    </g>
    <line x1="1.5" y1="37.5" x2="878.5" y2="37.5" stroke="url(#ember)" stroke-opacity="0.5" stroke-width="1"/>

    <!-- left accent rail + gutter -->
    <rect x="1.5" y="38" width="3" height="188" fill="url(#ember)" opacity="0.9"/>
    <line x1="54" y1="38" x2="54" y2="228" stroke="#dc2626" stroke-opacity="0.16" stroke-width="1"/>
    <g font-family="Consolas, monospace" font-size="12" fill="#5a4a4d" text-anchor="end">
      <text x="42" y="72">01</text><text x="42" y="108">02</text><text x="42" y="132">03</text><text x="42" y="156">04</text><text x="42" y="180">05</text>
    </g>

    <!-- content -->
    <text x="70" y="72" font-family="Consolas, monospace" font-size="14.5"><tspan fill="#dc2626" font-weight="700">&#10148;</tspan><tspan fill="#f5f5f5"> tail -f /var/log/muhammed-koca.log</tspan></text>

    <!-- progress bar row 1 -->
    <text x="70" y="108" font-family="Consolas, monospace" font-size="13.5"><tspan fill="#f43f5e" font-weight="700">[BUILD]</tspan><tspan fill="#d4d4d4">  MusclePull (AI SaaS)</tspan></text>
    <rect x="330" y="98" width="380" height="10" rx="5" fill="#dc2626" fill-opacity="0.12"/>
    <rect x="330" y="98" width="0" height="10" rx="5" fill="url(#barFill)">
      <animate attributeName="width" from="0" to="304" dur="1.2s" begin="0.3s" fill="freeze"/>
    </rect>
    <text x="720" y="108" font-family="Consolas, monospace" font-size="13" fill="#d4d4d4">80%</text>

    <!-- progress bar row 2 -->
    <text x="70" y="132" font-family="Consolas, monospace" font-size="13.5"><tspan fill="#f43f5e" font-weight="700">[BUILD]</tspan><tspan fill="#d4d4d4">  MhFW Optimizations</tspan></text>
    <rect x="330" y="122" width="380" height="10" rx="5" fill="#dc2626" fill-opacity="0.12"/>
    <rect x="330" y="122" width="0" height="10" rx="5" fill="url(#barFill)">
      <animate attributeName="width" from="0" to="342" dur="1.2s" begin="0.6s" fill="freeze"/>
    </rect>
    <text x="720" y="132" font-family="Consolas, monospace" font-size="13" fill="#d4d4d4">90%</text>

    <!-- write row -->
    <text x="70" y="156" font-family="Consolas, monospace" font-size="13.5"><tspan fill="#dc2626" font-weight="700">[WRITE]</tspan><tspan fill="#d4d4d4">  g&#252;nl&#252;k AI destekli i&#231;erik hatt&#305; &#8212; muhammedkoca.com.tr</tspan></text>

    <!-- goal row -->
    <text x="70" y="180" font-family="Consolas, monospace" font-size="13.5"><tspan fill="#4ade80" font-weight="700">[GOAL ]</tspan><tspan fill="#d4d4d4">  2026 &#8594; chaos engineering lab &#183; tam self-healing stack</tspan></text>

    <rect x="76" y="192" width="8" height="15" fill="#dc2626"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
  </g>
</svg>

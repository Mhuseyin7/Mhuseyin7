<svg width="880" height="240" viewBox="0 0 880 240" preserveAspectRatio="xMidYMid meet" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#60a5fa" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="railGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#93c5fd" stop-opacity="1"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </linearGradient>
    <filter id="tsGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="waClip"><rect x="0.5" y="0.5" width="879" height="239" rx="12"/></clipPath>
  </defs>

  <rect x="0.5" y="0.5" width="879" height="239" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1"/>

  <g clip-path="url(#waClip)">
    <!-- gentle scanline sweep -->
    <rect x="0" y="-40" width="880" height="40" fill="url(#scan)">
      <animate attributeName="y" values="-40;240" dur="9s" repeatCount="indefinite"/>
    </rect>

    <!-- title bar -->
    <rect x="1" y="1" width="878" height="34" rx="12" fill="#1e293b"/>
    <rect x="1" y="20" width="878" height="15" fill="#1e293b"/>
    <circle cx="22" cy="18" r="5.5" fill="#475569"/>
    <circle cx="42" cy="18" r="5.5" fill="#475569"/>
    <circle cx="62" cy="18" r="5.5" fill="#475569"/>
    <text x="440" y="22" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" fill="#cbd5e1">muhammed@muhammedkoca.com.tr: ~</text>
    <line x1="1" y1="35" x2="879" y2="35" stroke="#334155" stroke-width="1"/>

    <!-- left accent rail + traveling pulse -->
    <rect x="1" y="36" width="2" height="203" fill="#60a5fa" opacity="0.55"/>
    <rect x="1" y="36" width="2" height="60" fill="url(#railGlow)" filter="url(#tsGlow)">
      <animate attributeName="y" values="36;179;36" dur="5s" repeatCount="indefinite"/>
    </rect>

    <!-- gutter -->
    <line x1="54" y1="36" x2="54" y2="240" stroke="#334155" stroke-width="1"/>
    <g font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" fill="#94a3b8" text-anchor="end">
      <text x="42" y="70">01</text>
      <text x="42" y="100">02</text>
      <text x="42" y="124">03</text>
      <text x="42" y="148">04</text>
      <text x="42" y="172">05</text>
      <text x="42" y="196">06</text>
    </g>

    <!-- content — each line fades in staggered -->
    <g font-family="'JetBrains Mono', Consolas, monospace" font-size="13.5">
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.1s" fill="freeze"/>
        <text x="70" y="70"><tspan fill="#60a5fa">$</tspan><tspan fill="#f8fafc"> whoami --full</tspan></text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.5s" fill="freeze"/>
        <text x="70" y="100"><tspan fill="#cbd5e1">name    </tspan><tspan fill="#f8fafc">   Muhammed Koca</tspan></text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.75s" fill="freeze"/>
        <text x="70" y="124"><tspan fill="#cbd5e1">role    </tspan><tspan fill="#f8fafc">   Full-Stack Architecture - Self-hosted Apps</tspan></text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1s" fill="freeze"/>
        <text x="70" y="148"><tspan fill="#cbd5e1">based   </tspan><tspan fill="#f8fafc">   Bursa, T&#252;rkiye</tspan></text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.25s" fill="freeze"/>
        <text x="70" y="172"><tspan fill="#cbd5e1">journey </tspan><tspan fill="#f8fafc">   2022 First step &#8594; 2023 Foundation &#8594; 2024 Small projects &#8594; 2025+ full command</tspan></text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.5s" fill="freeze"/>
        <text x="70" y="196"><tspan fill="#cbd5e1">writing </tspan><tspan fill="#f8fafc">   muhammedkoca.com.tr &#8212; 1001+ posts &#183; 5 categories &#183; 1.1M+ words</tspan></text>
      </g>
    </g>

    <!-- cursor -->
    <rect x="76" y="212" width="8" height="14" fill="#60a5fa" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.8s" fill="freeze"/>
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" begin="2.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>

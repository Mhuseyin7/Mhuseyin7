<svg width="880" height="140" viewBox="0 0 880 140" preserveAspectRatio="xMidYMid meet" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="msLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cbd5e1"/>
      <stop offset="0.7" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="msGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="msClip"><rect x="0.5" y="0.5" width="879" height="139" rx="12"/></clipPath>
  </defs>

  <rect x="0.5" y="0.5" width="879" height="139" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>

  <g clip-path="url(#msClip)">
    <!-- top eyebrow -->
    <text x="30" y="30" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#475569" letter-spacing="0.28em">MILESTONES / 2022 &#8594; 2026</text>
    <text x="850" y="30" text-anchor="end" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#64748b" letter-spacing="0.28em">FOUR-YEAR ARC</text>
    <line x1="30" y1="42" x2="850" y2="42" stroke="#cbd5e1" stroke-width="1"/>

    <!-- timeline main line — grows left→right on load -->
    <line x1="80" y1="82" x2="80" y2="82" stroke="url(#msLine)" stroke-width="1.6" stroke-linecap="round">
      <animate attributeName="x2" from="80" to="800" dur="1.4s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1" keyTimes="0;1"/>
    </line>
    <!-- dashed overlay ambient shimmer -->
    <line x1="80" y1="82" x2="800" y2="82" stroke="#1d4ed8" stroke-width="1" stroke-dasharray="2 8" stroke-opacity="0.5">
      <animate attributeName="stroke-dashoffset" values="0;-20" dur="3s" repeatCount="indefinite"/>
    </line>

    <!-- Node 2022 -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.6s" fill="freeze"/>
      <circle cx="80" cy="82" r="5" fill="#2563eb" filter="url(#msGlow)"/>
      <circle cx="80" cy="82" r="9" stroke="#cbd5e1" stroke-width="1" fill="none"/>
      <text x="80" y="70" text-anchor="middle" font-family="'Inter', sans-serif" font-size="20" font-weight="700" fill="#0f172a" letter-spacing="-0.4">2022</text>
      <text x="80" y="108" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" fill="#64748b" letter-spacing="0.24em">FIRST STEP</text>
    </g>

    <!-- Node 2023 -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.85s" fill="freeze"/>
      <circle cx="260" cy="82" r="5" fill="#2563eb" filter="url(#msGlow)"/>
      <circle cx="260" cy="82" r="9" stroke="#cbd5e1" stroke-width="1" fill="none"/>
      <text x="260" y="70" text-anchor="middle" font-family="'Inter', sans-serif" font-size="20" font-weight="700" fill="#0f172a" letter-spacing="-0.4">2023</text>
      <text x="260" y="108" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" fill="#64748b" letter-spacing="0.24em">FOUNDATION</text>
    </g>

    <!-- Node 2024 -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.1s" fill="freeze"/>
      <circle cx="440" cy="82" r="5" fill="#2563eb" filter="url(#msGlow)"/>
      <circle cx="440" cy="82" r="9" stroke="#cbd5e1" stroke-width="1" fill="none"/>
      <text x="440" y="70" text-anchor="middle" font-family="'Inter', sans-serif" font-size="20" font-weight="700" fill="#0f172a" letter-spacing="-0.4">2024</text>
      <text x="440" y="108" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" fill="#64748b" letter-spacing="0.24em">SMALL PROJECTS</text>
    </g>

    <!-- Node 2025 -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.35s" fill="freeze"/>
      <circle cx="620" cy="82" r="5" fill="#2563eb" filter="url(#msGlow)"/>
      <circle cx="620" cy="82" r="9" stroke="#cbd5e1" stroke-width="1" fill="none"/>
      <text x="620" y="70" text-anchor="middle" font-family="'Inter', sans-serif" font-size="20" font-weight="700" fill="#0f172a" letter-spacing="-0.4">2025</text>
      <text x="620" y="108" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" fill="#64748b" letter-spacing="0.24em">FULL COMMAND</text>
    </g>

    <!-- Node 2026 — emphasized -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.6s" fill="freeze"/>
      <circle cx="800" cy="82" r="7" fill="#1d4ed8" filter="url(#msGlow)">
        <animate attributeName="r" values="6;9;6" dur="2.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="800" cy="82" r="14" stroke="#2563eb" stroke-width="1" fill="none" opacity="0.6">
        <animate attributeName="r" values="12;18;12" dur="2.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0.1;0.7" dur="2.6s" repeatCount="indefinite"/>
      </circle>
      <text x="800" y="70" text-anchor="middle" font-family="'Inter', sans-serif" font-size="22" font-weight="800" fill="#0f172a" letter-spacing="-0.4">2026</text>
      <text x="800" y="108" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#1d4ed8" letter-spacing="0.28em" font-weight="700">SYSTEM ARCHITECT</text>
    </g>

    <!-- Traveling pulse dot along the line -->
    <circle r="3" fill="#1d4ed8" filter="url(#msGlow)" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="4.5s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="80;800" dur="4.5s" begin="2s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1" keyTimes="0;1"/>
      <animate attributeName="cy" values="82;82" dur="4.5s" begin="2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>

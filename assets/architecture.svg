<svg width="880" height="400" viewBox="0 0 880 400" preserveAspectRatio="xMidYMid meet" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="flow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#3b82f6" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0.5" y="0.5" width="879" height="399" rx="12" fill="#0a0a0b" stroke="#1c1c20" stroke-width="1"/>
  <rect x="0" y="12" width="2" height="376" fill="#3b82f6"/>

  <!-- Corner labels -->
  <text x="30" y="30" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#a1a1aa" letter-spacing="0.24em">ARCHITECTURE / STACK MAP</text>
  <text x="850" y="30" text-anchor="end" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#52525a" letter-spacing="0.24em">FOUR-TIER · SELF-HOSTED</text>
  <line x1="30" y1="42" x2="850" y2="42" stroke="#1c1c20" stroke-width="1"/>

  <!-- Layer label style guide: left column at x=30-90, tiles start at x=130 -->
  <!-- 4 layers, y = 70, 140, 210, 280 (center-y of tile row) -->

  <!-- Row labels (left column) -->
  <g font-family="'JetBrains Mono', Consolas, monospace" font-size="10" fill="#52525a" letter-spacing="0.28em">
    <text x="30" y="74">EDGE</text>
    <text x="30" y="144">APP</text>
    <text x="30" y="214">API · DOMAIN</text>
    <text x="30" y="284">DATA · STATE</text>
  </g>

  <!-- Layer 1: EDGE -->
  <g transform="translate(130 60)">
    <rect x="0" y="0" width="210" height="34" rx="6" fill="#111114" stroke="#1c1c20" stroke-width="1"/>
    <text x="14" y="21" font-family="'Inter', sans-serif" font-size="12.5" fill="#f4f4f5" font-weight="500">Cloudflare Tunnel</text>
    <circle cx="196" cy="17" r="3" fill="#3b82f6"/>
  </g>
  <g transform="translate(360 60)">
    <rect x="0" y="0" width="210" height="34" rx="6" fill="#111114" stroke="#1c1c20" stroke-width="1"/>
    <text x="14" y="21" font-family="'Inter', sans-serif" font-size="12.5" fill="#f4f4f5" font-weight="500">Nginx / Reverse Proxy</text>
    <circle cx="196" cy="17" r="3" fill="#3b82f6"/>
  </g>
  <g transform="translate(590 60)">
    <rect x="0" y="0" width="210" height="34" rx="6" fill="#111114" stroke="#1c1c20" stroke-width="1"/>
    <text x="14" y="21" font-family="'Inter', sans-serif" font-size="12.5" fill="#f4f4f5" font-weight="500">CDN · Edge Cache</text>
    <circle cx="196" cy="17" r="3" fill="#3b82f6"/>
  </g>

  <!-- Layer 2: APP -->
  <g transform="translate(130 130)">
    <rect x="0" y="0" width="210" height="34" rx="6" fill="#111114" stroke="#1c1c20" stroke-width="1"/>
    <text x="14" y="21" font-family="'Inter', sans-serif" font-size="12.5" fill="#f4f4f5" font-weight="500">Next.js · React</text>
  </g>
  <g transform="translate(360 130)">
    <rect x="0" y="0" width="210" height="34" rx="6" fill="#111114" stroke="#1c1c20" stroke-width="1"/>
    <text x="14" y="21" font-family="'Inter', sans-serif" font-size="12.5" fill="#f4f4f5" font-weight="500">Astro (Blog · SSR)</text>
  </g>
  <g transform="translate(590 130)">
    <rect x="0" y="0" width="210" height="34" rx="6" fill="#111114" stroke="#1c1c20" stroke-width="1"/>
    <text x="14" y="21" font-family="'Inter', sans-serif" font-size="12.5" fill="#f4f4f5" font-weight="500">Electron · Desktop</text>
  </g>

  <!-- Layer 3: API -->
  <g transform="translate(130 200)">
    <rect x="0" y="0" width="210" height="34" rx="6" fill="#111114" stroke="#1c1c20" stroke-width="1"/>
    <text x="14" y="21" font-family="'Inter', sans-serif" font-size="12.5" fill="#f4f4f5" font-weight="500">Node.js · FastAPI</text>
  </g>
  <g transform="translate(360 200)">
    <rect x="0" y="0" width="210" height="34" rx="6" fill="#111114" stroke="#1c1c20" stroke-width="1"/>
    <text x="14" y="21" font-family="'Inter', sans-serif" font-size="12.5" fill="#f4f4f5" font-weight="500">Python · MhFW</text>
  </g>
  <g transform="translate(590 200)">
    <rect x="0" y="0" width="210" height="34" rx="6" fill="#111114" stroke="#1c1c20" stroke-width="1"/>
    <text x="14" y="21" font-family="'Inter', sans-serif" font-size="12.5" fill="#f4f4f5" font-weight="500">WebSocket · SSE</text>
  </g>

  <!-- Layer 4: DATA -->
  <g transform="translate(130 270)">
    <rect x="0" y="0" width="210" height="34" rx="6" fill="#111114" stroke="#1c1c20" stroke-width="1"/>
    <text x="14" y="21" font-family="'Inter', sans-serif" font-size="12.5" fill="#f4f4f5" font-weight="500">PostgreSQL · Prisma</text>
  </g>
  <g transform="translate(360 270)">
    <rect x="0" y="0" width="210" height="34" rx="6" fill="#111114" stroke="#1c1c20" stroke-width="1"/>
    <text x="14" y="21" font-family="'Inter', sans-serif" font-size="12.5" fill="#f4f4f5" font-weight="500">Redis · Cache</text>
  </g>
  <g transform="translate(590 270)">
    <rect x="0" y="0" width="210" height="34" rx="6" fill="#111114" stroke="#1c1c20" stroke-width="1"/>
    <text x="14" y="21" font-family="'Inter', sans-serif" font-size="12.5" fill="#f4f4f5" font-weight="500">MySQL · Backup 3-2-1</text>
  </g>

  <!-- Connections between layers (3 columns × 3 gaps) -->
  <g stroke="#1c1c20" stroke-width="1">
    <!-- Column 1 -->
    <line x1="235" y1="94" x2="235" y2="130"/>
    <line x1="235" y1="164" x2="235" y2="200"/>
    <line x1="235" y1="234" x2="235" y2="270"/>
    <!-- Column 2 -->
    <line x1="465" y1="94" x2="465" y2="130"/>
    <line x1="465" y1="164" x2="465" y2="200"/>
    <line x1="465" y1="234" x2="465" y2="270"/>
    <!-- Column 3 -->
    <line x1="695" y1="94" x2="695" y2="130"/>
    <line x1="695" y1="164" x2="695" y2="200"/>
    <line x1="695" y1="234" x2="695" y2="270"/>
  </g>

  <!-- Animated data flow dots — moving down each column, subtle -->
  <g>
    <circle r="2" fill="#3b82f6">
      <animate attributeName="cy" values="94;304" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="235;235" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle r="2" fill="#3b82f6">
      <animate attributeName="cy" values="94;304" dur="7s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="7s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="465;465" dur="7s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <circle r="2" fill="#3b82f6">
      <animate attributeName="cy" values="94;304" dur="8s" begin="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="8s" begin="4s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="695;695" dur="8s" begin="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Observability rail across bottom -->
  <line x1="30" y1="340" x2="850" y2="340" stroke="#1c1c20" stroke-width="1"/>
  <g transform="translate(0 356)">
    <text x="30" y="12" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" fill="#3b82f6" letter-spacing="0.28em">OBSERVABILITY</text>
    <text x="440" y="12" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" fill="#a1a1aa" letter-spacing="0.24em">LOGS · METRICS · TRACES · SELF-HEAL LOOP</text>
    <text x="850" y="12" text-anchor="end" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" fill="#52525a" letter-spacing="0.28em">BARE-METAL · BURSA/TR</text>
    <!-- pulsing bracket -->
    <line x1="30" y1="24" x2="850" y2="24" stroke="#3b82f6" stroke-width="1" stroke-dasharray="1 6" opacity="0.4">
      <animate attributeName="stroke-dashoffset" values="0;-14" dur="4s" repeatCount="indefinite"/>
    </line>
  </g>
</svg>

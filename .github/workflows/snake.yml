# 🚘 Contribution Traffic — katkıların arasında makas atan araba animasyonu üretir.
# Çıktı: "output" branch'ine açık ve koyu tema SVG'leri yazılır.

name: Generate Contribution Car

on:
  schedule:
    - cron: "0 3 * * *" # her gece 03:00 UTC
  workflow_dispatch: # elle çalıştırma
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate contribution car SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: ${{ github.repository_owner }}
        run: python3 scripts/generate_contribution_car.py dist

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
